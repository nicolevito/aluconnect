services:
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: aluconnect_web:latest
    container_name: aluconnect_web
    command: >
      sh -c "export PYTHONPATH=/app && 
             python manage.py migrate --noinput &&
             gunicorn aluconnect.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app
      - ./static:/app/static
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: aluconnect_celery
    command: sh -c "export PYTHONPATH=/app && celery -A aluconnect worker -l info --concurrency=4"
    env_file:
      - .env
    volumes:
      - ./src:/app
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - PYTHONPATH=/app
      - OPENAI_API_KEY=${OPENAI_API_KEY}


  celery-beat:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: aluconnect_celery_beat
    command: sh -c "export PYTHONPATH=/app && celery -A aluconnect beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    env_file:
      - .env
    volumes:
      - ./src:/app
    depends_on:
      - web
      - rabbitmq
    environment:
      - PYTHONPATH=/app

  flower:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: aluconnect_flower
    command: sh -c "export PYTHONPATH=/app && celery -A aluconnect flower --broker=$CELERY_BROKER_URL"
    env_file:
      - .env
    ports:
      - "5555:5555"
    depends_on:
      - rabbitmq
    environment:
      - PYTHONPATH=/app

  db:
    image: postgres:15
    container_name: aluconnect_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: aluconnect_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5673:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  rabbitmq_data:
